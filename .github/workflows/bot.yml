name: Wohnungs- und Lagerbot

# Läuft durchgehend: Jeder Lauf sucht ca. 5,5 Stunden lang alle 5 Minuten
# und startet am Ende selbst den nächsten Lauf. Der Zeitplan ist nur ein
# Ersatz, falls die Kette einmal abreißt.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  suche:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_CHAT_ID_LAGER: ${{ secrets.TELEGRAM_CHAT_ID_LAGER }}
      IMAP_USER: ${{ secrets.IMAP_USER }}
      IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Suchen (alle 5 Minuten, ca. 5,5 Stunden)
        run: |
          git config user.name "wohnungsbot"
          git config user.email "wohnungsbot@users.noreply.github.com"
          end=$(( $(date +%s) + 330*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            python bot.py --scheduled || true
            python bot.py --profile lager --scheduled || true
            git add seen*.json market*.json
            if ! git diff --cached --quiet; then
              git commit -q -m "Stand aktualisiert"
              git pull -q --rebase && git push -q || true
            fi
            sleep $(( 270 + RANDOM % 60 ))
          done
      - name: Nächsten Lauf starten
        if: always()
        run: gh workflow run bot.yml --repo "${{ github.repository }}" --ref main
