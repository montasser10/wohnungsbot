name: Wohnungs- und Lagerbot

on:
  schedule:
    # alle 20 Minuten, 04-22 Uhr UTC (= ca. 6-23 Uhr deutscher Zeit; die genaue Nachtpause prüft der Bot selbst)
    - cron: "*/20 4-22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  suche:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_CHAT_ID_LAGER: ${{ secrets.TELEGRAM_CHAT_ID_LAGER }}
      IMAP_USER: ${{ secrets.IMAP_USER }}
      IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Wohnungen suchen
        run: python bot.py --scheduled
      - name: Lager suchen
        if: always()
        run: python bot.py --profile lager --scheduled
      - name: Stand speichern (schon gesendete Anzeigen)
        if: always()
        run: |
          git config user.name "wohnungsbot"
          git config user.email "wohnungsbot@users.noreply.github.com"
          git add seen*.json market*.json
          git diff --cached --quiet || (git commit -q -m "Stand aktualisiert" && git push -q)
